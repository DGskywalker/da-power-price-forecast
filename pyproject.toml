[project]
name = "dappf"
version = "0.1.0"
description = "Production-grade day-ahead electricity price forecasting system for DE-LU and GB bidding zones"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quantitative Energy Analytics Team", email = "quant@example.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "torch>=2.2.0",
    "optuna>=3.6.0",
    "statsmodels>=0.14.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "entsoe-py>=0.5.10",
    "requests>=2.31.0",
    "jinja2>=3.1.3",
    "reportlab>=4.1.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
