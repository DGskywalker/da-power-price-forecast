# Hyperparameter configurations and search spaces

lightgbm:
  default_params:
    objective: "regression_l1"  # MAE optimized
    metric: "mae"
    boosting_type: "gbdt"
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    verbose: -1
  quantiles: [0.1, 0.5, 0.9]
  optuna:
    n_trials: 20
    timeout: 300
    search_space:
      learning_rate: [0.01, 0.15]
      num_leaves: [15, 63]
      max_depth: [4, 8]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.5, 1.0]
      min_child_samples: [10, 50]

xgboost:
  default_params:
    objective: "reg:absoluteerror"
    eval_metric: "mae"
    n_estimators: 250
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

catboost:
  default_params:
    loss_function: "MAE"
    eval_metric: "MAE"
    iterations: 250
    learning_rate: 0.05
    depth: 6
    random_seed: 42
    verbose: 0

lstm:
  seq_len: 168        # 7 days lookback
  horizon: 24         # 24 hours day-ahead forecast
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 64
  epochs: 25
  patience: 7
  device: "cpu"       # auto-switched to mps/cuda if available
